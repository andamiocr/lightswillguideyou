# Regenera la versión en inglés (en/index.html) cada vez que cambia index.html.
name: Generar versión en inglés
on:
  push:
    branches: [main]
    paths: ['index.html', 'herramientas/generar_en.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 herramientas/generar_en.py
      - name: Guardar si cambió
        run: |
          if [ -n "$(git status --porcelain en/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add en/index.html
            git commit -m "Actualizar versión en inglés (automático)"
            git push
          fi
